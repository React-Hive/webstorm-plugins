pluginVersion = 0.2.0

# Lowest WebStorm/IDEA build the plugin declares support for.
pluginSinceBuild = 252

# Leave blank so the plugin is not disabled by an IDE upgrade.
pluginUntilBuild =

# The IDE the plugin compiles against. Defaults to a local WebStorm install, which
# avoids downloading a ~1 GB IDE distribution. Override with -PplatformLocalPath=...
# or the WEBSTORM_HOME environment variable.
platformLocalPath = /Applications/WebStorm.app/Contents

# The IntelliJ Platform ships Java 25 bytecode, so the build needs a JDK 25. WebStorm's
# bundled JetBrains Runtime is one, which avoids installing a separate JDK. Point this
# at any JDK 25 if you prefer, or delete the line to use JAVA_HOME.
org.gradle.java.home = /Applications/WebStorm.app/Contents/jbr/Contents/Home

org.gradle.jvmargs = -Xmx2g -XX:MaxMetaspaceSize=768m
org.gradle.parallel = true
org.gradle.caching = true
